, "style": null, "text": "Nunapitchuk"}, {"type": "paragraph", "style": null, "text": "Oscarville"}, {"type": "paragraph", "style": null, "text": "Pilot Station"}, {"type": "paragraph", "style": null, "text": "Pitka's Point"}, {"type": "paragraph", "style": null, "text": "Platinum"}, {"type": "paragraph", "style": null, "text": "Quinhagak"}, {"type": "paragraph", "style": null, "text": "Red Devil"}, {"type": "paragraph", "style": null, "text": "Russian Mission"}, {"type": "paragraph", "style": null, "text": "Scammon Bay"}, {"type": "paragraph", "style": null, "text": "Shageluk"}, {"type": "paragraph", "style": null, "text": "Sleetmute"}, {"type": "paragraph", "style": null, "text": "St. Mary's"}, {"type": "paragraph", "style": null, "text": "Stony River"}, {"type": "paragraph", "style": null, "text": "Toksook Bay"}, {"type": "paragraph", "style": null, "text": "Tuluksak"}, {"type": "paragraph", "style": null, "text": "Tuntutuliak"}, {"type": "paragraph", "style": null, "text": "Tununak"}, {"type": "paragraph", "style": null, "text": "Upper Kalskag"}, {"type": "paragraph", "style": "Heading2", "text": "Akiachak"}, {"type": "paragraph", "style": null, "text": "Akiachak is a primarily Yup’ik community on the west bank of the Kuskokwim River, upriver from Bethel (about 18 miles northeast of Bethel) in the lower Kuskokwim sub-region. It is a small village (population ~750), with a strong subsistence economy based on salmon, whitefish, waterfowl, and berries. Historically, Akiachak has been an important river settlement and was among the first villages in the region to assert tribal self-governance under federal self-determination laws: in 1939, Aniak was one of the earliest communities to adopt the Indian Reorganization Act in Alaska. The community faces increasing riverbank erosion, flood and ice-jam risk on the Kuskokwim River, permafrost thaw affecting foundations and boardwalks, and broader climate-driven changes to fish and wildlife. Adaptation planning has focused on improving critical infrastructure while protecting in place where feasible (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Akiachak (Second-Class City)P.O. Box 70Akiachak, Alaska 99551Phone: (907) 825-4020"}, {"type": "paragraph", "style": null, "text": "Akiachak Native CommunityP.O. Box 51070 Akiachak, Alaska 99551Phone: (907) 825-4626  Fax: (907) 825-4029Akiachak Limited (Village Corporation)P.O. Box 51010 Akiachak, Alaska 99551Phone: (907) 825-4328  Fax: 825-4115YKHC – Akiachak ClinicPhone: (907) 825-3400School: Akiachak School (YKSD/LKSD boundary region)Phone: (907) 825-3611"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Many or most homes in Akiachak do not have running water. Land fill permit # SW3AID4-27 expires 4/27."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Akiak"}, {"type": "paragraph", "style": null, "text": "Akiak lies on the west bank of the Kuskokwim River north of Bethel (about 42 miles northeast of Bethel), closely connected with Akiachak and Tuluksak in the lower Kuskokwim area. It is a small, predominantly Yup’ik community with a few hundred residents (population ~450), long used as a seasonal fish camp before permanent settlement. Akiak is known for its river-based subsistence lifestyle and participation in regional dog mushing and river travel. The community is exposed to spring breakup flooding, severe riverbank erosion, and thawing permafrost that together threaten homes, roads, and the airstrip. Local and regional plans emphasize strengthening riverbank protection, upgrading utilities on pilings, and sustaining subsistence harvests under changing river and sea ice conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of AkiakP.O. Box 52028 Akiak, Alaska 99552Phone: (907) 765-7411  Fax: (907) 765-7414"}, {"type": "paragraph", "style": null, "text": "Mayor (summer 2026): Olinka JonesAkiak Native CommunityP.O. Box 52127Akiak, Alaska 99552Phone: (907) 765-7112*  Fax: (907) 765-7512 (*Cannot make long-distance calls from this number)Kokarmuit CorporationP.O. Box 52126Akiak, Alaska 99552Phone: (907) 765-7111YKHC – Akiak ClinicPhone: (907) 765-7114Akiak School (Yupiit School District)Phone: (907) 825-3600"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: As the community retreats to higher ground, homes are within 200 feet of the landfill. Landfill Permit # SW3A179-27; exp. 6/27."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Alakanuk"}, {"type": "paragraph", "style": null, "text": "Alakanuk is located on the south bank of the Yukon River near its mouth, in the Lower Yukon sub-region of the Y-K Region. It is one of the larger river villages, with several hundred residents (population ~750-800), many of whom are Yup’ik and rely heavily on salmon and whitefish. Historically, the community developed from seasonal fish camps as commercial and subsistence fishing expanded in the late nineteenth and twentieth centuries. Alakanuk faces significant flooding, ice-jam events, and erosion along the Yukon River and surrounding sloughs, with storms and high water occasionally inundating low-lying areas. Climate change compounds these risks through more frequent extreme weather and shifts in salmon runs, pushing the community toward a mix of protect-in-place measures and long-term adaptation planning (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of AlakanukP.O. Box 149Alakanuk, Alaska 99554Phone: (907) 238-3415  Fax: (907) 238-3737Native Village of AlakanukP.O. Box 149Alakanuk, Alaska 99554Phone: (907) 238-3714  Fax: (907) 238-3715Alakanuk Native CorporationP.O. Box 198Alakanuk, Alaska 99554Phone: (907) 238-3411YKHC – Alakanuk ClinicPhone: (907) 238-3712Alakanuk School (LYSD)Phone: (907) 238-3713"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Aniak"}, {"type": "paragraph", "style": null, "text": "Aniak sits on the south bank of the Kuskokwim River at the head of (west of) the Aniak Slough, 60-70 river miles upriver from Bethel in the Middle Kuskokwim area. It is a subregional hub community of several hundred residents (population ~500), with a mixed economy that includes subsistence, limited commercial activity, and government and service-sector jobs. Aniak grew around mining, trading, and mission activity in the early twentieth century and later became an important air and river junction with strong ties to aviation, fishing, and river transport. Environmental risks include riverbank erosion along the slough and main channel, flooding during breakup, and permafrost degradation under roads and buildings, which can destabilize foundations and runways. The community is generally planning to protect in place with better bank protection, elevated infrastructure, and improved emergency preparedness (Wikipedia)."}, {"type": "paragraph", "style": null, "text": "City of AniakP.O. Box 70Aniak, Alaska 99557Phone: (907) 675-4455  Fax: (907) 675-4517Native Village of AniakP.O. Box 349Aniak, Alaska 99557Phone: (907) 675-4349  Fax: (907) 675-4513Kuskokwim Corporation (TKC – ANCSA Regional Village Corporation)P.O. Box 227Aniak, Alaska 99557Phone: (907) 675-4275  Fax: (907) 675-4276YKHC – Aniak Subregional ClinicPhone: (907) 675-4556Aniak School (Kuspuk School District)Phone: (907) 675-4450"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Atmautluak"}, {"type": "paragraph", "style": null, "text": "Atmautluak is a small Yup’ik community built on tundra and wetlands along the Pitmiktalik River, a tributary of the Kuskokwim, northwest of Bethel. It developed from traditional seasonal fish and hunting camps into a permanent village in the twentieth century. Atmautluak’s boardwalks and homes are built over saturated ground and discontinuous permafrost, making it especially vulnerable to flooding, ground subsidence, and thaw-related damage. Regional adaptation work highlights Atmautluak, Kasigluk, and Nunapitchuk as closely linked “boardwalk communities” facing recurrent overbank flooding and water pooling, which threaten homes, sewage systems, and travel routes. Long-term plans consider a combination of local elevation and, potentially, partial managed retreat from the most flood-prone areas (Anchorage Daily News)."}, {"type": "paragraph", "style": null, "text": "Tribal Village of Atmautluak P.O. Box 6568 99559 Phone: 553-5610 Fax 553-5612"}, {"type": "paragraph", "style": null, "text": "Atmautluak Ltd. P.O. Box 6548 Phone: 553-5428Fax: 553-5610"}, {"type": "paragraph", "style": null, "text": "School (LKSD)Phone: 543-4800"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: No running water in homes. There is river access to the 2.0-acre landfill (# SW3A201-24; expired 3/24)."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Bethel"}, {"type": "paragraph", "style": null, "text": "Bethel is the regional service and transportation hub of the Yukon-Kuskokwim Region, located on the Kuskokwim River about 400 air miles west of Anchorage and 40 miles from the Bering Sea (about 70 river miles). It has a population of nearly 7,000 people and hosts the Yukon-Kuskokwim Delta Regional Hospital, regional offices for AVCP, Calista, YKHC, LKSD, and other organizations, as well as the main airport linking villages to the rest of Alaska (Yukon Kuskokwim Health Corporation). It is the administrative, transportation, and health center for 56 tribes and 48 communities. Historically a trading post and mission center, Bethel has grown into a multicultural town with strong Yup’ik roots and modern amenities. Environmental concerns include riverbank erosion, flooding in low-lying neighborhoods (vulnerability to storm-driven surges), permafrost thaw affecting utilities and roads, and regional air-quality and public-health stresses associated with climate change and energy costs. Planning is strongly oriented toward protecting in place, upgrading infrastructure, and serving as a logistics hub for climate adaptation projects in surrounding villages (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of BethelP.O. Box 1388Bethel, Alaska 99559Phone: (907) 543-1386  Fax: (907) 543-1388Orutsararmiut Native Council (ONC)P.O. Box 927Bethel, Alaska 99559Phone: (907) 543-2608  Fax: (907) 543-2639Bethel Native CorporationP.O. Box 719Bethel, Alaska 99559Phone: (907) 543-2124YKHC – Yukon-Kuskokwim Delta Regional HospitalPhone: (907) 543-6000LKSD – Lower Kuskokwim School District HeadquartersPhone: (907) 543-4800Bethel Schools (BRHS, Gladys Jung, Ayaprun Immersion, etc.)Main Line: (907) 543-4800"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Running water, Class II landfill."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Chefornak"}, {"type": "paragraph", "style": null, "text": "Chefornak is a Cup’ik village on the south bank of the Kinia River near its mouth on the Bering Sea coast, southwest of Bethel in the coastal sub-region. The community has several hundred residents and traces its origins to traditional seasonal camps that later consolidated into a permanent village. Chefornak’s economy relies on a mix of subsistence, seasonal work, and limited wage jobs in local services. As a low-lying coastal community built on permafrost, Chefornak is highly vulnerable to coastal storms, erosion, permafrost thaw, and flooding that threaten houses, boardwalks, and essential facilities. Regional climate strategies classify coastal Cup’ik villages like Chefornak as environmentally threatened, with a focus on stronger shoreline protection, elevated and relocatable infrastructure, and long-term planning for possible managed retreat from the most exposed areas (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "Chefornak suffered extreme damage from ex-Typhoon Halong in October 2025. The storm destroyed the sewage lagoon and landfill, contaminating local subsistence areas. The boardwalks were largely destroyed and have since been rebuilt."}, {"type": "paragraph", "style": null, "text": "When the community of Kipnuk voted to relocate after Halong, two thirds of its voters selected a relocation site near the historical settlement of Cicing, which is roughly 13 miles northwest of Kipnuk and at a safer elevation. Chefornak Chefarnmute’s corporation owns the land and is actively negotiating with Kipnuk to convey land use and rights."}, {"type": "paragraph", "style": null, "text": "City of ChefornakP.O. Box 29 Chefornak, AK 99561Phone: 867-8147Fax: 867-8704"}, {"type": "paragraph", "style": null, "text": "Tribe P.O. Box 127Chefornak, AK 99561Phone: 867-8500Fax: 867-8711"}, {"type": "paragraph", "style": null, "text": "Chefarnmute Inc. P.O. Box 70Chefornak, AK 99561Phone: 867-8115Fax: 867-8895"}, {"type": "paragraph", "style": null, "text": "School: LKSD School District"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Chevak"}, {"type": "paragraph", "style": null, "text": "Chevak is an inland Cup’ik community situated a short distance from the Bering Sea coast in the Kusilvak (formerly Wade Hampton) Census Area, between the Kashunuk River and coastal wetlands. It is served by the Kashunamiut School District and has approximately 950 residents. Chevak was formed in the 1950s as families consolidated from Kashunak and Old Chevak - residents of older villages consolidated for school, church, and air access, making it a relatively “newer” permanent settlement compared to traditional sites. Environmental risks include flooding, permafrost thaw, and erosion of slough banks. Boardwalks require continual maintenance. Although not directly on the coast, Chevak faces high winds, heavy snowfall, changing precipitation, and thawing ground that affect roads, the airport, and housing, along with regional threats to subsistence resources. The community is generally pursuing protect-in-place strategies while addressing aging infrastructure and high energy costs (Anchorage Daily News)."}, {"type": "paragraph", "style": null, "text": "City of ChevakP.O. Box 100Chevak, Alaska 99563Phone: (907) 858-7422  Fax: (907) 858-7812Native Village of Chevak (Cup’ik)P.O. Box 140Chevak, Alaska 99563Phone: (907) 858-5811  Fax: (907) 858-6325Chevak Company (Village Corporation)P.O. Box 138Chevak, Alaska 99563Phone: (907) 858-7421YKHC – Chevak ClinicPhone: (907) 858-6832Chevak School (LYSD)Phone: (907) 858-6120"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Chuathbaluk"}, {"type": "paragraph", "style": null, "text": "Chuathbaluk is located on the north bank of the Kuskokwim River in the Middle Kuskokwim area, near (upriver from) Aniak. It grew from a traditional seasonal camp into a permanent settlement influenced by gold mining, missions, and trading posts in the early twentieth century. It is historically associated with the former Russian Orthodox mission settlement at Kolmakof. The community today is small (~120 people) and maintains a strong subsistence orientation. Environmental risks include riverbank erosion, flooding during high water events, and permafrost thaw under roads and buildings. Adaptation priorities include stabilizing vulnerable riverbanks, reinforcing community infrastructure, and maintaining safe river travel under changing ice conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of ChuathbalukP.O. Box CHUChuathbaluk, Alaska 99557Phone: (907) 467-4313  Fax: (907) 467-4314Chuathbaluk Traditional CouncilP.O. Box CHUChuathbaluk, Alaska 99557Phone: (907) 467-4317  Fax: (907) 467-4316The Kuskokwim Corporation – ChuathbalukP.O. Box CHUChuathbaluk, Alaska 99557Phone: (907) 467-4318YKHC – Chuathbaluk ClinicPhone: (907) 467-4315George Morgan Sr. School (Kuspuk School District)Phone: (907) 467-4320"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Crooked Creek"}, {"type": "paragraph", "style": null, "text": "Crooked Creek is located at the mouth of Crooked Creek on the east bank of the Kuskokwim River downstream of Sleetmute in the Middle Kuskokwim region. Historically, the community has been tied to mining (known historically as a mining-era supply point for the Kuskokwim region), river trade, and subsistence fishing and hunting. Today it is a small village (population ~90–100) with limited wage employment and high reliance on subsistence harvests. Crooked Creek faces flooding issues, particularly during spring breakup, and erosion along riverbanks and sloughs. As permafrost thaws, some community infrastructure is at risk of subsidence and damage. Planning emphasis is on protect-in-place measures such as elevating buildings, improving drainage, and enhancing emergency response capabilities (AVCP)."}, {"type": "paragraph", "style": null, "text": "Crooked Creek Tribal CouncilP.O. Box 69Crooked Creek, Alaska 99575Phone: (907) 432-2200  Fax: (907) 432-2201Crooked Creek Corporation (TKC Village Corporation)P.O. Box 70Crooked Creek, Alaska 99575Phone: (907) 432-2220YKHC – Crooked Creek ClinicPhone: (907) 432-2777Crooked Creek School (Kuspuk School District)Phone: (907) 432-2221"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Eek"}, {"type": "paragraph", "style": null, "text": "Eek is a small Yup’ik community located on the Eek River, a tributary of the Kuskokwim, in the coastal tundra southwest of Bethel. Historically, it developed from a traditional fish camp into a permanent village associated with river and coastal trade. Residents continue to rely heavily on subsistence fishing, hunting, and gathering, with some wage employment in local services and schools. Eek is exposed to flooding from the Eek River and to impacts from coastal storms that push water upriver, along with permafrost thaw affecting foundations and boardwalks. Regional climate work identifies Eek as at risk from erosion and infrastructure damage, though current strategies focus on incremental protection and infrastructure upgrades rather than full relocation (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of EekP.O. Box 9Eek, Alaska 99578Phone: (907) 536-5129  Fax: (907) 536-5711"}, {"type": "paragraph", "style": null, "text": "Native Village of EekP.O. Box 89Eek, Alaska 99578Phone: (907) 536-5128  Fax: (907) 536-5711"}, {"type": "paragraph", "style": null, "text": "Iqtijouaq CorporationP.O. Box 49Eek, Alaska 99578Phone: (907) 536-5211 Fax: (907) 536-5733"}, {"type": "paragraph", "style": null, "text": "Eek School District is LKSD"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority: AVCP RHA"}, {"type": "paragraph", "style": "Heading2", "text": "Emmonak"}, {"type": "paragraph", "style": null, "text": "Emmonak sits near the mouth of the Yukon River at Kwiguk Pass, close to the Bering Sea, and serves as an important Lower Yukon hub. Emmonak was relocated from the former village of Kwiguk due to flooding. The community has several hundred residents (~850–900) and a long history as a salmon fishing and trading center. Emmonak hosts a subregional YKHC clinic and has been home to the Yukon Delta Fisheries Development Association’s (YDFDA) Kwik’Pak processing plant, a major source of employment and regional income (Wikipedia). Environmental risks include storm surge (repeated disaster-level fall storms), coastal and riverine flooding, erosion, and permafrost thaw, all of which threaten housing, fuel storage, and transportation infrastructure. Adaptation measures focus on flood preparedness, protective infrastructure, and diversifying the local economy as salmon runs decline and climate impacts intensify (AP News)."}, {"type": "paragraph", "style": null, "text": "City of EmmonakP.O. Box 9Emmonak, Alaska 99581Phone: (907) 949-1227  Fax: (907) 949-1921Emmonak Tribal CouncilP.O. Box 89Emmonak, Alaska 99581Phone: (907) 949-1225  Fax: (907) 949-1920Emmonak CorporationP.O. Box 49Emmonak, Alaska 99581Phone: (907) 949-1248YKHC – Emmonak ClinicPhone: (907) 949-3500Emmonak School (LYSD)Phone: (907) 949-1248"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Goodnews Bay"}, {"type": "paragraph", "style": null, "text": "Goodnews Bay is located on the coast of the Bering Sea at the mouth of the Goodnews River, south of the main Y-K Delta but within the broader Calista region. Historically tied to placer mining, commercial fishing, and subsistence, the community today is small but active in salmon fisheries when runs allow. Goodnews Bay faces coastal erosion, storm surge, and permafrost thaw, with homes and infrastructure vulnerable to high winds and flooding along the river. Though there is discussion of long-term climate risk, the community is currently focused on protecting in place through raised structures, improved storm preparedness, and infrastructure maintenance (epi.anthc.org)."}, {"type": "paragraph", "style": null, "text": "City of Goodnews Bay P.O. Box 139Goodnews Bay, Alaska 99589Phone: (907) 967-8614  Fax: (907) 967-8124"}, {"type": "paragraph", "style": null, "text": "Native Village of Goodnews Bay P.O. Box 03Goodnews Bay, Alaska 99589Phone: (907) 7967-8929  Fax: (907) 967-8330"}, {"type": "paragraph", "style": null, "text": "Kuitsarak Incorporation P.O. Box 150Goodnews Bay, Alaska 99589Phone: (907) 967-8428  Fax: (907) 967-8226"}, {"type": "paragraph", "style": null, "text": "School District: LKSD"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Hooper Bay"}, {"type": "paragraph", "style": null, "text": "Hooper Bay is a large (population ~1,200) coastal Cup’ik community on the Bering Sea shore southwest of Bethel, south of Scammon Bay, and serves as a subregional hub with a YKHC clinic, school, and commercial services (Wikipedia). The village developed around traditional coastal camps and has long been central to Yup’ik cultural life, including dance, hunting, and coastal trade. Hooper Bay is highly exposed to coastal storms, erosion, flooding, and permafrost thaw/ tundra collapse, which together threaten homes, fuel facilities, and critical infrastructure. Regional climate assessments identify Hooper Bay as one of the environmentally threatened coastal communities that may eventually need a mix of protective works and partial relocation of infrastructure to safer ground (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of Hooper BayP.O. Box 29Hooper Bay, Alaska 99604Phone: (907) 758-4310  Fax: (907) 758-4510Native Village of Hooper BayP.O. Box 2193Hooper Bay, Alaska 99604Phone: (907) 758-4915  Fax: (907) 758-4066Hooper Bay CorporationP.O. Box 156Hooper Bay, Alaska 99604Phone: (907) 758-4917YKHC – Hooper Bay Sub-Regional ClinicPhone: (907) 758-3500Hooper Bay School (LYSD)Phone: (907) 758-4225"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kasigluk"}, {"type": "paragraph", "style": null, "text": "Kasigluk is a Yup’ik community built on islands and wetlands along the Johnson River, approximately 20 miles northwest of Bethel in the lower Kuskokwim area. It is linked by boardwalks and is closely associated with Nunapitchuk and Atmautluak as low-lying “boardwalk villages.” Kasigluk itself consists of two smaller villages, called Akiuk and Akula. Residents depend heavily on subsistence, and the village retains strong Yup’ik language and cultural practices. Boardwalks and homes are built over saturated ground and discontinuous permafrost, making these boardwalk communities especially vulnerable to flooding, ground subsidence, and thaw-related damage. Kasigluk faces chronic flooding, ponding, and permafrost degradation that damage homes, sewage systems, and travel routes (Anchorage Daily News). It is identified as an environmentally threatened community, with planning discussions around elevating or relocating infrastructure and assessing the feasibility of long-term managed retreat from the most flood-prone areas."}, {"type": "paragraph", "style": null, "text": "Kasigluk Traditional Council P.O. Box 19 Kasigluk, AK 99609-0019Phone: (907) 477-6405  Fax: (907) 477-6212"}, {"type": "paragraph", "style": null, "text": "Native Village CorporationP.O. Box 39Kasigluk, AK 99609Phone: (907) 447-6113  Fax: (907) 477-6026"}, {"type": "paragraph", "style": null, "text": "School District: LKSD"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kipnuk"}, {"type": "paragraph", "style": null, "text": "Kipnuk is a traditional Yup’ik community located along the Kugkaktlik River near its mouth on Kuskokwim Bay, southwest of Bethel. Historically, Kipnuk grew from traditional coastal camps that supported rich marine and river subsistence harvests. The community has several hundred residents (population ~750) and participates in the CDQ program through Coastal Villages Region Fund and other fisheries support (Alaska State Legislature). Kipnuk has faced severe environmental threats, including flooding, erosion, and permafrost collapse (usteq). Kipnuk was devastated by the remnants of Typhoon Halong, which damaged homes and forced the evacuation of the entire community (a few remained to rebuild and there has been an ongoing effort to retrieve and replace homes and other infrastructure."}, {"type": "paragraph", "style": null, "text": "When the community of Kipnuk voted to relocate after Halong, two thirds of its voters selected a relocation site near the historical settlement of Cicing, which is roughly 13 miles northwest of Kipnuk and at a safer elevation. Chefornak Chefarnmute’s corporation owns the land and is actively negotiating with Kipnuk to convey land use and rights."}, {"type": "paragraph", "style": null, "text": "City of KipnukP.O. Box 57Kipnuk, Alaska 99614Phone: (907) 896-5205Native Village of KipnukP.O. Box 57Kipnuk, Alaska 99614Phone: (907) 896-5515Kipnuk CorporationP.O. Box 146Kipnuk, Alaska 99614Phone: (907) 896-5505YKHC – Kipnuk ClinicPhone: (907) 896-5815Chief Paul Memorial School (LKSD)Phone: (907) 896-5425"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kongiganak"}, {"type": "paragraph", "style": null, "text": "Kongiganak is located on the east bank of the Kuskokwim River estuary near Kuskokwim Bay, not far from Kwigillingok and other coastal villages. The village has a few hundred (~450) residents and developed from traditional coastal fish camps into a permanent settlement after mid-twentieth-century school and church construction. The village is traditionally based on coastal subsistence including fishing and marine mammals. Kongiganak experiences erosion and flooding from both river and coastal storms, as well as thawing permafrost under homes and boardwalks. Like neighboring communities, it is considered at elevated environmental risk, with adaptation strategies focusing on strengthening shoreline protection, elevating critical facilities, and improving evacuation and emergency planning (AVCP).Native Village of KongiganakP.O. Box 5069Kongiganak, Alaska 99559Phone: (907) 557-5226  Fax: (907) 557-5224Qemirtalek Coast  CorporationP.O. Box 5070 Kongiganak, Alaska 99559Phone: (907) 557-5529  Fax: (907) 557-5517YKHC – Kongiganak ClinicPhone: (907) 557-5521Ayagina'ar Elitnaurvik School (LKSD)Phone: (907) 557-5312"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kotlik"}, {"type": "paragraph", "style": null, "text": "Kotlik lies on the east bank of the Kotlik River near where it joins the Yukon River, close to the Bering Sea and 35 miles northeast of Emmonak. The village of Bill Moore's Slough is contained within Kotlik. Kotlik is built on several small islands formed by Yukon River channels. It has ~650–700 residents whose livelihoods center on salmon fishing, waterfowl, marine mammals, hunting, and trapping, along with school and local government jobs. Kotlik has experienced significant flooding and storm impacts, including a notable 2013 storm that flooded homes and infrastructure. The community continues to face erosion, rising water levels, ice-jams, and permafrost thaw that undermine buildings and threaten fuel storage and sewage systems. Adaptation efforts focus on elevating housing, improving drainage and bank protection, and sustaining subsistence amidst declining salmon runs and changing sea ice (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of KotlikP.O. Box 20506Kotlik, Alaska 99620Phone: (907) 899-4411  Fax: (907) 899-4413Village of Kotlik (IRA Council)P.O. Box 20096Kotlik, Alaska 99620Phone: (907) 899-4320Kotlik Native CorporationP.O. Box 20507Kotlik, Alaska 99620Phone: (907) 899-4410YKHC – Kotlik ClinicPhone: (907) 899-4114Kotlik School (LYSD)Phone: (907) 899-4412"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kwethluk"}, {"type": "paragraph", "style": null, "text": "Kwethluk is located on the east bank of the Kwethluk River, a major tributary of the Kuskokwim, near its confluence with the Kuskokwim and upriver from Bethel. Its population of several hundred  (750–800) is predominantly Yup’ik, with a strong subsistence focus on salmon, whitefish, moose, and waterfowl. Historically, Kwethluk was an important seasonal and later permanent settlement along key trading and travel routes. It is one of the oldest villages on the river and home to strong cultural traditions. Environmental risks include riverbank erosion and migration, ice-jam and rain-on-snow flooding, and thawing permafrost under homes and public facilities. The community’s adaptation approach emphasizes protect-in-place measures, updated community planning, and improvements in water, sewer, and transportation infrastructure to withstand changing conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of KwethlukP.O. Box 50 Kwethluk, Alaska 99621Phone: (907) 757-6022   Fax: (907) 757-6487 Org.  Village of KwethlukP.O. Box 130Kwethluk, Alaska 99621Phone: (907) 757-6714   Fax: (907) 757-6328 Kwethluk, Inc. (Village Corporation)P.O. Box 110 Kwethluk, Alaska 99621Phone: (907) 757-6212 YKHC – Kwethluk ClinicPhone: (907) 757-6310Kwethluk School (LKSD)Phone: (907) 757-6710"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The community mainly still on honey buckets, there is no wnn? After a power loss, the water system froze."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Kwigillingok"}, {"type": "paragraph", "style": null, "text": "Kwigillingok is a coastal Yup’ik village located near the mouth of the Kwigillingok River on Kuskokwim Bay, south of Kongiganak and Kipnuk. Residents (~380 before ex-Typhoon Halong in Oct. 2025) depend heavily on marine and river subsistence harvests, as well as limited commercial and CDQ-related employment. Kwigillingok has been severely impacted by recent coastal storms, including Typhoon Halong, which caused widespread flooding and infrastructure damage in the region (AP News). Ongoing environmental risks include storm surge, erosion, permafrost thaw, and sea-level change, all of which constrain future building sites. The community is exploring a combination of shoreline protection, raising critical facilities, and long-term planning for possible relocation of particularly vulnerable infrastructure (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of KwigillingokP.O. Box 49Kwigillingok, Alaska 99622Phone: (907) 588-8811Native Village of KwigillingokP.O. Box 49Kwigillingok, Alaska 99622Phone: (907) 588-8141Kwigillingok Ltd.P.O. Box 82Kwigillingok, Alaska 99622Phone: (907) 588-8112YKHC – Kwigillingok ClinicPhone: (907) 588-8128Kwigillingok School (LKSD)Phone: (907) 588-8115"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority: AVCP RHA"}, {"type": "paragraph", "style": "Heading2", "text": "Lime Village"}, {"type": "paragraph", "style": null, "text": "Lime Village is a very small (fewer than 25 year-round residents), remote community located inland along the upper Stony River in the Kuskokwim Mountains, well upriver from the main Kuskokwim corridor. Historically rooted in Athabascan–Yup’ik interactions and seasonal use areas, it remains one of the most sparsely populated settlements associated with the broader Y-K Region. Lime Village faces environmental risks related to permafrost thaw, wildfires, and changing wildlife and fish distributions rather than coastal erosion or storm surge. Its isolation poses challenges for emergency response and fuel delivery. The community’s extreme remoteness amplifies the impacts of any infrastructure damage, and adaptation options focus on reliable energy, safe air access, and maintaining traditional subsistence patterns under changing climate conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "Lime Village Traditional CouncilP.O. Box LIMELime Village, Alaska 99627Phone: (907) 746-5551City of Lime Village (Unincorporated)Lime Village Corporation (TKC Village Corporation)P.O. Box LIMELime Village, Alaska 99627Phone: (907) 746-5552Health Services: Served periodically via YKHC and regional itinerant providersEducation: Home-based and correspondence education, with some students attending school in Aniak or other communities"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Lower Kalskag"}, {"type": "paragraph", "style": null, "text": "Lower Kalskag is on the north bank of the Kuskokwim River, just downriver from Upper Kalskag and 26 miles from Aniak in the Middle Kuskokwim corridor. Lower Kalskag is linked to Upper Kalskag by a 2-mile long gravel road. It developed as a permanent village associated with traditional seasonal camps, church and mission activity, and later school and airstrip construction. Residents (~278) rely on subsistence fishing and hunting, supplemented by school and service employment. Lower Kalskag faces flooding and riverbank erosion, as well as permafrost-related ground movement that affects housing, roads, and utilities. The community and the Kuspuk School District have worked to maintain infrastructure and transport links, with adaptation planning focused on protecting in place and improving drainage and elevation of key facilities (Kyuk)."}, {"type": "paragraph", "style": null, "text": "Directory"}, {"type": "paragraph", "style": "Heading2", "text": "Marshall"}, {"type": "paragraph", "style": null, "text": "Marshall is located on a bluff above the Yukon River in the Lower Yukon area, providing some natural protection against flooding compared to lower-lying villages. Historically linked to the former village of Ohogamiut and associated with mining (Fortuna Ledge) and trading, Marshall’s population (~450) is largely Yup’ik, with a subsistence-based economy supported by wage work in schools and local services. Environmental risks include erosion of riverbanks and slopes, ice-jam flooding, more extreme weather, and potential instability of permafrost affecting roads and building foundations. While considered less urgently threatened than some low-lying delta communities, Marshall is nonetheless planning for infrastructure upgrades, drainage improvements, and emergency preparedness in light of climate change (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of MarshallP.O. Box 110Marshall, Alaska 99585Phone: (907) 679-6215  Fax: (907) 679-6216Native Village of Marshall (Iqurmuit)P.O. Box 110Marshall, Alaska 99585Phone: (907) 679-6328  Fax: (907) 679-6926Marshall Native CorporationP.O. Box 100Marshall, Alaska 99585Phone: (907) 679-6810YKHC – Marshall ClinicPhone: (907) 679-6111Marshall School (LYSD)Phone: (907) 679-6112"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Mekoryuk"}, {"type": "paragraph", "style": null, "text": "Mekoryuk is the only permanent village on Nunivak Island in the Bering Sea, west of the main Y-K Delta. It is a Nunivak Cup’ik (Cup’ig) community with a few hundred residents whose history includes reindeer herding, commercial furbearer harvests, and strong retention of language and cultural traditions (AVCP). Environmental risks for Mekoryuk include coastal erosion, storm surge, and permafrost thaw, but the island’s higher elevations allow some flexibility to move structures inland or upslope as needed. Adaptation efforts emphasize safeguarding the airstrip and fuel facilities, maintaining reliable marine access, and supporting food security as marine ecosystems change (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of MekoryukP.O. Box 29Mekoryuk, Alaska 99630Phone: (907) 827-8314  Fax: (907) 827-8626"}, {"type": "paragraph", "style": null, "text": "Native Village of MekoryukP.O. Box 66Mekoryuk, Alaska 99630Phone: (907) 827-8828  Fax: (907) 827-8133"}, {"type": "paragraph", "style": null, "text": "Nima Corporation P.O. Box 52Mekoryuk, Alaska 99630Phone: (907) 827-8636  Fax: (907) 827-8639"}, {"type": "paragraph", "style": null, "text": "LKSD School district"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Mekoryuk needs a new LF site, the current one is on the beach. It is 6.3 acres and permit #SW3A107-30 expires 6/30."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Mountain Village"}, {"type": "paragraph", "style": null, "text": "Mountain Village lies along the north bank of the Yukon River in the Lower Yukon sub-region and historically served as an important trading and mission center. Population ~800, it is now one of the larger villages in the Kusilvak Census Area and is a transportation and trade center for the Lower Yukon with a mixed cash–subsistence economy. Mountain Village has experienced flooding, bank erosion, and permafrost thaw that together threaten housing and public buildings. The Lower Yukon School District has operated a district office here, though recent budget constraints have led to restructuring (Kyuk). Adaptation planning focuses on protecting existing infrastructure, updating water and sewer systems, and improving evacuation planning for flood events."}, {"type": "paragraph", "style": null, "text": "City of Mountain VillageP.O. Box 320Mountain Village, Alaska 99632Phone: (907) 591-2511  Fax: (907) 591-2814Asa’carsarmiut Traditional CouncilP.O. Box 322Mountain Village, Alaska 99632Phone: (907) 591-2812Deputy Director Kory Joe: atcadmin2@asacarsarmiut.orgFinance Assistant Gwendolyn Ground: atcoffice2@asacarsarmiut.org"}, {"type": "paragraph", "style": null, "text": "Asaacarsaq CorporationP.O. Box 322Mountain Village, Alaska 99632Phone: (907) 591-2811YKHC – Mountain Village ClinicPhone: (907) 591-2815Mountain Village School (LYSD)Phone: (907) 591-2810"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority: The tribe has its own housing authority, Asa’carsarmiut Tribal Housing Department. Phone: 907-591-2814. Housing Projects Director is Alex Beans:  atchousing2@asacarsarmiut.org."}, {"type": "paragraph", "style": "Heading2", "text": "Napakiak"}, {"type": "paragraph", "style": null, "text": "Napakiak is located on the west bank of the Kuskokwim River just downstream from Bethel. It is a Yup’ik community with several hundred residents (~350), historically tied to river trade and subsistence fishing. Napakiak is one of the most severely erosion-threatened communities in Alaska; rapid Kuskokwim River bank loss has forced the community to pursue a managed retreat strategy, relocating homes, the school, and infrastructure inland to safer ground.(NRDC) The village has secured significant federal and state funding for school relocation and erosion response, making it an example of partial managed retreat in the Yukon-Kuskokwim Region."}, {"type": "paragraph", "style": null, "text": "City of NapakiakP.O. Box 34009 Napakiak, Alaska 99634Phone: (907) 589 -2611   Fax: (907) 589 -2612 Native Village of NapakiakP.O. Box 34069 Napakiak, Alaska 99634Phone: (907) 589-2135   Fax: (907) 589-2136 Napakiak CorporationP.O. Box 34030 Napakiak, Alaska 99634Phone: (907) 589-2227 Fax: (907) 589-2442"}, {"type": "paragraph", "style": null, "text": "YKHC – Napakiak ClinicPhone: (907) 588-3535Napakiak School (LKSD)Phone: (907) 588-3331"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Napaskiak"}, {"type": "paragraph", "style": null, "text": "Napaskiak is situated on the east bank of the Kuskokwim River, across from Bethel and upriver from Napakiak. Historically a Yup’ik fish camp and later a permanent village, it now has several hundred residents (~450) who depend on subsistence fishing and hunting, along with wage work in local services and the nearby hub of Bethel. Napaskiak faces flooding and erosion risk as the river channel shifts, as well as permafrost thaw affecting boardwalks and foundations. It is often grouped with Napakiak and other lower Kuskokwim communities in climate adaptation planning, emphasizing elevation or relocation of critical facilities, improved shoreline protection, and emergency planning (Anchorage Daily News)."}, {"type": "paragraph", "style": null, "text": "City of NapaskiakP.O. Box 6109 Napaskiak, Alaska 99559   Phone: (907) 737-7626   Fax: (907) 737-7412   Native Village of NapaskiakP.O. Box 6009    Napaskiak, Alaska 99559 Phone: (907) 737-7364    Fax: (907) 737-7039   Napaskiak Inc. 101 Cemetery Drive Napaskiak, Alaska 99559  Phone: (907) 737-7413   YKHC – Napaskiak ClinicPhone: (907) 737-7325Z.J. Williams Memorial School (LKSD)Phone: (907) 737-7320"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The landfill is 3.0 acres, permit  #SW3A108-31, expires 6/31. The landfill floods regularly and is too close to the tank farm to allow burning. It is too wet for heavy equipment."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Newtok–Mertarvik"}, {"type": "paragraph", "style": null, "text": "Newtok was a Yup’ik village on the Ninglick River northwest of Bethel, historically sustained by rich wetlands and river resources. Severe erosion, flooding, and permafrost thaw made the original Newtok site uninhabitable, leading the community to secure land on Nelson Island for a new village, Mertarvik (CakeX). Over the past two decades, Newtok has undergone one of the first full (modern) community relocations in Alaska, with residents moving in phases to Mertarvik, where new housing, a school, utilities, and an evacuation center have been constructed. Today, Newtok’s former site is depopulated, while Mertarvik has become the permanent community and is often called Newtok and will become Newtok in the future. The Newtok–Mertarvik story is a key example of full relocation as a climate adaptation pathway in the Yukon-Kuskokwim Region (AP News)."}, {"type": "paragraph", "style": null, "text": "Newtok VillageP.O. 5596Newtok, AK 9959Phone: (907) 237-2202  Fax: (907) 237-2210"}, {"type": "paragraph", "style": null, "text": "Newtok Native CorporationP.O. Box 5528Newtok, Alaska 99559Phone: (907) 237-2200 Fax: (907) 237-2710"}, {"type": "paragraph", "style": null, "text": "LKSD School (open?)"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Landfill permit #SW3A193-29, expires 1/29. The landfill is 2.5 acres. Much of the community was on honey buckets."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Nightmute"}, {"type": "paragraph", "style": null, "text": "Nightmute is a Yup’ik community on Nelson Island, inland from the Bering Sea coast but still strongly tied to marine and river resources. Historically, it has been associated with nearby seasonal-use sites such as Umkumiut. Nightmute’s residents maintain a subsistence lifestyle focused on fish, marine mammals, waterfowl, and gathering. Although there is discontinuous permafrost on Nelson Island, the entire island is elevated on solid volcanic bedrock. While the bedrock provides safer structural foundations, the island's surface layer still contains permafrost that is actively degrading. While less immediately threatened by open-ocean storm surge than some coastal villages, Nightmute still faces permafrost thaw, changing snow and ice conditions, and shifting wildlife patterns. Adaptation planning focuses on improving energy efficiency, maintaining reliable transportation links, and supporting subsistence practices in a changing climate (AVCP)."}, {"type": "paragraph", "style": null, "text": "Directory"}, {"type": "paragraph", "style": "Heading2", "text": "Nunam Iqua"}, {"type": "paragraph", "style": null, "text": "Nunam Iqua (formerly Sheldon Point) is located near the mouth of the Yukon River, close to coastal wetlands and sloughs in the Lower Yukon sub-region. It is the westernmost Yukon River community. It is a small Yup’ik community (~200-250) with a strong subsistence orientation (salmon, whitefish, and marine mammals) and participation in Lower Yukon fisheries. The community faces significant environmental risks from flooding, storm surges, and erosion, especially during fall storms that push water into low-lying settlement areas. Permafrost thaw and changing river ice conditions further challenge infrastructure and winter travel. Adaptation strategies focus on improving flood protection, raising structures, and enhancing emergency response, with an eye toward long-term viability on the existing site (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Nunam IquaP.O. Box 201Nunam Iqua, Alaska 99666Phone: (907) 498-4800  Fax: (907) 498-4801Native Village of Nunam IquaP.O. Box 201Nunam Iqua, Alaska 99666Phone: (907) 498-4802  Fax: (907) 498-4803Nunam Iqua CorporationP.O. Box 202Nunam Iqua, Alaska 99666Phone: (907) 498-4804YKHC – Nunam Iqua ClinicPhone: (907) 498-4805Nunam Iqua School (LYSD)Phone: (907) 498-4806"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Nunapitchuk"}, {"type": "paragraph", "style": null, "text": "Nunapitchuk is a Yup’ik community built on islands and wetlands along the Johnson River, north of Bethel. It is linked by boardwalks and is closely associated with Kasigluk and Atmautluak as low-lying “boardwalk villages.” Residents depend heavily on subsistence, and the village retains strong Yup’ik language and cultural practices. Nunapitchuk faces chronic flooding, ponding, and permafrost degradation that damage homes, sewage systems, and travel routes (Anchorage Daily News). It is identified as an environmentally threatened community, with planning discussions around elevating or relocating infrastructure and assessing the feasibility of long-term managed retreat from the most flood-prone areas."}, {"type": "paragraph", "style": null, "text": "City of Nunapitchuk P.O. Box 190Nunaptchuk, Alaska 99641Phone: (907) 527-5327 Fax: (907) 527-5011"}, {"type": "paragraph", "style": null, "text": "Native Village of Nunapitchuk P.O. Box 130Nunaptchuk, Alaska 99641Phone: (907) 527-5705 Fax: (907) 527-5711"}, {"type": "paragraph", "style": null, "text": "Nunapitchuk Ltd.P.O. Box 129Nunaptchuk, Alaska 99641Phone: (907) 527-5717 Fax: (907) 527-5229"}, {"type": "paragraph", "style": null, "text": "LKSD school"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The 4.5-acre landfill, permit #SW3A061-31, expires 5/31 but will likely close sooner. The community is currently considering relocating the landfill closer to Kasigaluk than to Nunapitchuq. Nunap also has a food waste pond."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Oscarville"}, {"type": "paragraph", "style": null, "text": "Oscarville is a very small Yup’ik community (population ~70-80) located on the Kuskokwim River just downriver from Bethel and Napaskiak. Historically a seasonal fish camp, it became a small permanent village tied tightly to Bethel for services and employment. Oscarville’s population is small, but residents maintain active subsistence practices and close family ties with nearby communities. The community just built a new church. Environmental risks include erosion and flooding along the Kuskokwim River, as well as permafrost thaw under structures. Given its small size and proximity to Bethel, future adaptation options may include both local protect-in-place measures and increased reliance on regional services in Bethel (AVCP)."}, {"type": "paragraph", "style": null, "text": "Oscarville Traditional Village P.O. Box 6129 Napaskiak Alaska 99559Phone: (907) 737-2032"}, {"type": "paragraph", "style": null, "text": "Oscarville Native Corporation P.O. Box 6085Napaskiak, Alaska 99559Phone: (907) 737-7090"}, {"type": "paragraph", "style": null, "text": "YKHC – Oscarville Clinic (Services provided via Bethel)Phone: (907) 543-6000Education: Students typically attend school in Napaskiak or Bethel (LKSD??)"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The community had a 1-acre landfill. The permit (# SW3A175-22) expired in 4/2022."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Pilot Station"}, {"type": "paragraph", "style": null, "text": "Pilot Station is located on the high north bank of the Yukon River in the Lower Yukon sub-region, historically serving as an important pilot and navigation point along the river (location where Yukon River pilots boarded vessels navigating the river). The community has several hundred residents (~550–600) and a mixed cash–subsistence economy. Environmental risks include flooding, erosion along the riverbank, and thawing permafrost that can damage roads and housing. As with other Lower Yukon villages, Pilot Station also faces declining salmon runs and changing weather patterns that affect subsistence. Community planning emphasizes maintaining critical infrastructure, supporting river transportation safety, and addressing fuel and energy reliability under changing conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Pilot StationP.O. Box 450Pilot Station, Alaska 99650Phone: (907) 549-3211  Fax: (907) 549-3212Pilot Station Traditional CouncilP.O. Box 447Pilot Station, Alaska 99650Phone: (907) 549-3251  Fax: (907) 549-3252Pilot Station, Inc. (Village Corporation)P.O. Box 468Pilot Station, Alaska 99650Phone: (907) 549-3231YKHC – Pilot Station ClinicPhone: (907) 549-3311Pilot Station School (LYSD)Phone: (907) 549-3213"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Pitka's Point"}, {"type": "paragraph", "style": null, "text": "Pitkas Point is a small community (~120) near the confluence of the Yukon River and Andreafsky River, approximately 5 miles downstream on the Andreafsky from St. Mary’s in the Kusilvak Census Area. Many residents have relocated to St. Mary’s over past decades due to flooding risks. Historically, it has been associated with seasonal and permanent settlements serving river transportation and subsistence activities. The small population relies on salmon, whitefish, and other subsistence resources, with limited wage employment in local services. Environmental concerns include flood risk, erosion, and permafrost thaw, though the village’s slightly higher ground provides some relative protection compared with very low-lying delta settlements. Adaptation planning is modest and focused primarily on infrastructure maintenance and emergency preparedness (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Pitka's PointPitka's Point, Alaska 99658Phone: (907) 438-2511  Fax: (907) 438-2512Native Village of Pitka's PointP.O. Box 127Pitka's Point, Alaska 99658Phone: (907) 438-2470  Fax: (907) 438-2471Pitka's Point CorporationP.O. Box 129Pitka's Point, Alaska 99658Phone: (907) 438-2513YKHC – Pitka's Point Clinic (served via St. Mary’s)Phone: (907) 438-3500Education: Most students attend school in nearby St. Mary’s"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Platinum"}, {"type": "paragraph", "style": null, "text": "Platinum is a coastal community on the Bering Sea near the mouth of Goodnews Bay, historically tied to platinum mining that began in the 1930s. It is a very small settlement with a mixed mining, fisheries, and subsistence history and is part of the broader Calista region, though historically it has not always fallen within YKHC’s service boundaries (epi.anthc.org). Environmental risks include coastal erosion, storm surge, and permafrost thaw. The small population and industrial legacy add complexity to long-term adaptation, which may involve both protect-in-place strategies and potential shifts in settlement patterns over time (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of Platinum P.O. Box 47Platinum, Alaska 99651Phone: (907) 979-8114 Fax: (907) 979-8210"}, {"type": "paragraph", "style": null, "text": "Platinum Traditional Village  P.O. Box 08Platinum, Alaska 99651Phone: (907) 979-8220 Fax: (907) 979-8178"}, {"type": "paragraph", "style": null, "text": "Arriq Inc. P.O. Box 09Platinum, Alaska 99651Phone: (907) 979-8113 Fax: (907) 979-8229"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The landfill is approximately 0.5 acres and is not permitted. The community has not wanted to permit the landfill due to disagreements over land ownership of the site. There is a large area on an upland area (next to C&D cell?) it could expand into."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Quinhagak"}, {"type": "paragraph", "style": null, "text": "Quinhagak is a coastal Yup’ik community at the mouth of the Kanektok River on Kuskokwim Bay, southwest of Bethel. Population ~750–800, Quinhagak is known for its rich archeological sites (including the Nunalleq site) and as a center for subsistence fishing and hunting. Quinhagak has already experienced significant erosion and storm damage, including loss of land and infrastructure near the shoreline (Alaska Native Tribal Health Consortium). The community is considered environmentally threatened and is actively planning for stronger shoreline protection, elevating or moving structures, and potential partial relocation away from the most eroding areas. Climate impacts on salmon and marine ecosystems are an additional concern for local livelihoods (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of QuinhagakP.O. Box 90Quinhagak, Alaska 99655Phone: (907) 556-8129  Fax: (907) 556-8111Native Village of KwinhagakP.O. Box 149Quinhagak, Alaska 99655Phone: (907) 556-8165  Fax: (907) 556-8166Qanirtuuq, Inc. (Village Corporation)P.O. Box 69Quinhagak, Alaska 99655Phone: (907) 556-8160YKHC – Quinhagak ClinicPhone: (907) 556-8167Quinhagak School (LKSD)Phone: (907) 556-8120"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The landfill is 5.0 acres. Permit # SW3A041-29 expires 3/29. Quinhagak also has a transfer site."}, {"type": "paragraph", "style": null, "text": "Housing Authority: Quinhagak did establish its own tribal housing authority for several years. During that period it built the 5 octagonal homes with CCHRC. It has since rejoined AVCP RHA."}, {"type": "paragraph", "style": "Heading2", "text": "Red Devil"}, {"type": "paragraph", "style": null, "text": "Red Devil is a small former mining settlement on the Kuskokwim River in the Middle Kuskokwim region, historically associated with cinnabar (mercury) mining at the historical Red Devil Mine. The mine’s closure left a legacy of contaminated sites now undergoing long-term cleanup and monitoring. The remaining community is small (~25-35), with strong reliance on subsistence resources in an area affected by past industrial activity. Environmental risks include riverbank erosion, flooding, and potential exposure pathways from legacy mine contamination. Adaptation and environmental management in Red Devil focus on site remediation (potential contamination from historic mine tailings), monitoring of water and fish, flooding, and erosion along the Kuskokwim River. and maintaining safe access and infrastructure under changing climate conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "TKC is establishing a specialized sawmill and manufacturing facility in Red Devil to process regional timber into home packages (the Harvest to Home or H2H project). Red Devil was strategically chosen because it sits downriver from major timber resources and needs local employment and infrastructure."}, {"type": "paragraph", "style": null, "text": "Red Devil Tribal CouncilP.O. Box 84Red Devil, Alaska 99656Phone: (907) 447-6312City of Red Devil (Unincorporated)Red Devil Corporation (TKC Village Corporation)P.O. Box 85Red Devil, Alaska 99656Phone: (907) 447-6313YKHC – Red Devil Clinic (usually served via Sleetmute)Phone: (907) 449-3346Schooling: Students generally attend school in Sleetmute"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Russian Mission"}, {"type": "paragraph", "style": null, "text": "Russian Mission (Iqurmuit) is situated on the north bank of the Yukon River in the Lower Yukon sub-region. Established as a Russian Orthodox mission and trading post in the nineteenth century, it has evolved into a predominantly Yup’ik community (population ~350-400) combining subsistence with limited wage work. Environmental challenges include increasing wildfire risk in surrounding uplands, flooding, riverbank erosion, and permafrost thaw, together with shifts in salmon runs that affect the subsistence economy. Community planning priorities center on protecting key infrastructure, improving water and sanitation systems, and ensuring safe river travel and evacuation routes (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Russian MissionP.O. Box 9Russian Mission, Alaska 99657Phone: (907) 584-5211  Fax: (907) 584-5212Iqurmuit Traditional Council (Russian Mission Tribal Council)P.O. Box 9Russian Mission, Alaska 99657Phone: (907) 584-5213  Fax: (907) 584-5214Russian Mission Native CorporationP.O. Box 69Russian Mission, Alaska 99657Phone: (907) 584-5215YKHC – Russian Mission ClinicPhone: (907) 584-5216Russian Mission School (LYSD)Phone: (907) 584-5217"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Scammon Bay"}, {"type": "paragraph", "style": null, "text": "Scammon Bay is a coastal Yup’ik village near the mouth of the Kun River, just inland from the Bering Sea in the Lower Yukon coastal area at the base of the Askinuk Mountains. Residents ( ~600–650) rely on marine and river subsistence resources and limited commercial fishing. Scammon Bay faces significant exposure to coastal storms, storm surge, erosion, slope instability and landslide risk, and permafrost thaw, which together can threaten homes, the airstrip, and fuel storage. Like other coastal Y-K communities, it is considered at heightened environmental risk and is exploring upgraded shoreline protection, elevated infrastructure, and improved storm preparedness as protect-in-place measures, while monitoring long-term viability of the current townsite (AVCP)."}, {"type": "paragraph", "style": null, "text": "City of Scammon BayP.O. Box 90Scammon Bay, Alaska 99662Phone: (907) 558-5521  Fax: (907) 558-5522Native Village of Scammon BayP.O. Box 90Scammon Bay, Alaska 99662Phone: (907) 558-5523  Fax: (907) 558-5524Scammon Bay CorporationP.O. Box 69Scammon Bay, Alaska 99662Phone: (907) 558-5525YKHC – Scammon Bay ClinicPhone: (907) 558-5526Scammon Bay School (LYSD)Phone: (907) 558-5527"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Shageluk"}, {"type": "paragraph", "style": null, "text": "Shageluk is located on the east bank of the Innoko River, just above its confluence with the Yukon. It’s a Deg Hit'an Athabascan community (population  ~120) with a strong upriver cultural history. Shageluk’s environmental risks include flooding, erosion, changing river ice conditions, and impacts from warmer winters on traditional travel routes."}, {"type": "paragraph", "style": null, "text": "City of ShagelukP.O. Box 35Shageluk, Alaska 99665Phone: (907) 473-8239  Fax: (907) 473-8250Shageluk Native VillageP.O. Box 35Shageluk, Alaska 99665Phone: (907) 473-8237  Fax: (907) 473-8203Shageluk Native CorporationP.O. Box 36Shageluk, Alaska 99665Phone: (907) 473-8241YKHC – Shageluk ClinicPhone: (907) 473-8260Innoko River School (Iditarod Area School District)Phone: (907) 473-8256"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Sleetmute"}, {"type": "paragraph", "style": null, "text": "Sleetmute is located on the north bank of the Kuskokwim River upstream of Crooked Creek and Aniak in the Middle Kuskokwim. Historically, it served as a small river settlement providing important access, supply, and staging point to upriver trapping, hunting, and mining activities. The village population is small (~90–110), with subsistence activities central to daily life and limited wage employment in local services. Environmental risks include increasing wildfire risk in the surrounding boreal forest river flooding, erosion, and permafrost thaw affecting housing and the airstrip. Given its size and remoteness, adaptation planning emphasizes basic infrastructure resilience, safe water and sanitation, and reliable transportation links under changing weather and river conditions (AVCP)."}, {"type": "paragraph", "style": null, "text": "Sleetmute Traditional CouncilP.O. Box 44Sleetmute, Alaska 99668Phone: (907) 449-4269  Fax: (907) 449-4270City of Sleetmute (Unincorporated)Sleetmute Corporation (TKC Village Corporation)P.O. Box 45Sleetmute, Alaska 99668Phone: (907) 449-4271YKHC – Sleetmute ClinicPhone: (907) 449-4272Sleetmute School (Kuspuk School District)Phone: (907) 449-4273"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "St. Mary's"}, {"type": "paragraph", "style": null, "text": "St. Mary’s is situated near the confluence of the Andreafsky and Yukon Rivers and serves as a regional hub for the Lower Yukon area. The community originated from the historic Catholic mission at Andreafsky, there is a total population of ~550–600 and two main townsites (St. Mary’s and Andreafsky) and supports regional services, including a subregional YKHC clinic and the St. Mary’s City School District (Wikipedia). The community experiences flooding and erosion risks along the rivers, as well as permafrost-related ground movement. There is increased wildfire danger in surrounding uplands. Climate change also affects salmon and other subsistence resources. St. Mary’s is planning to protect in place by upgrading infrastructure, improving drainage, and strengthening emergency preparedness, while monitoring long-term shoreline stability (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of St. Mary’sP.O. Box 10St. Mary’s, Alaska 99658Phone: (907) 438-2228Fax: (907) 438-2229"}, {"type": "paragraph", "style": null, "text": "Algaaciq Native Village (St. Mary’s)P.O. Box 49St. Mary’s, Alaska 99658Phone: (907) 438-2335Fax: (907) 438-2334"}, {"type": "paragraph", "style": null, "text": "St. Mary’s Native CorporationP.O. Box 9St. Mary’s, Alaska 99658Phone: (907) 438-2505Fax: (907) 438-2510"}, {"type": "paragraph", "style": null, "text": "YKHC – St. Mary’s Subregional ClinicPhone: (907) 438-3500"}, {"type": "paragraph", "style": null, "text": "Andreafski School (Lower Yukon School District)Phone: (907) 438-2572"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Stony River"}, {"type": "paragraph", "style": null, "text": "Stony River is a very small (population ~40–50) remote inland village with mixed Athabascan and Yup’ik heritage located along the north bank of the Kuskokwim River near the mouth of the Stony River in the Middle Kuskokwim region. Historically, it served as a base for subsistence activities and limited mining and trapping. Today the population is highly reliant on subsistence and supported by basic services and a village clinic within the YKHC system (Yukon Kuskokwim Health Corporation). Environmental risks include ice-jam events, river flooding, erosion, and permafrost thaw, alongside increasing wildfire risk in interior tundra and boreal areas. Adaptation priorities focus on safe housing, reliable fuel and energy systems, and maintaining river and air access for supplies and health care (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "Stony River Traditional CouncilP.O. Box SRVStony River, Alaska 99557Phone: (907) 537-3211  Fax: (907) 537-3212Stony River Corporation (TKC Village Corporation)P.O. Box SRVStony River, Alaska 99557Phone: (907) 537-3213YKHC – Stony River ClinicPhone: (907) 537-3214Education: Local learning center; students often attend school in Aniak or other regional hubs"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation:"}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Toksook Bay"}, {"type": "paragraph", "style": null, "text": "Toksook Bay is a coastal Yup’ik community on the south side of Nelson Island, west of the main Y-K Delta, and hosts a YKHC subregional clinic (Wikipedia). It is one of the larger Nelson Island settlements (population ~650–700) with strong cultural traditions, including dance, subsistence, and use of surrounding islands and coastal waters. Environmental threats include coastal erosion, storm surge, permafrost thaw, and changing sea ice and marine ecosystems. Although there is discontinuous permafrost on Nelson Island, the entire island is elevated on solid volcanic bedrock. While the bedrock provides safer structural foundations, the island's surface layer still contains permafrost that is actively degrading. Toksook Bay is considered at risk but has some capacity to expand inland on higher ground. Adaptation approaches focus on strengthening shoreline protection, elevating or relocating infrastructure, and sustaining local food security and cultural practices under changing conditions (Adapt Alaska)."}, {"type": "paragraph", "style": null, "text": "City of Toksook BayP.O. Box 37008Toksook Bay, Alaska 99637Phone: (907) 427-7511  Fax: (907) 427-7811 Nunakauyarmiut Tribe P.O. Box 37048Toksook Bay, Alaska 99637Phone: (907) 427-7114   Fax: (907) 427-7114 Nunakaviak Yupik Corporation P.O. Box 37068Toksook Bay, Alaska 99637Phone: (907) 427-7929  Fax: (907) 427-7326YKHC – Toksook Bay Sub-Regional ClinicPhone: (907) 427-3500Toksook Bay School (LKSD)Phone: (907) 427-7515"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Toksook Bay has a 4-acre landfill; permit #SW3A183-27 expires 4/27."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Tuluksak"}, {"type": "paragraph", "style": null, "text": "Tuluksak (Tuulkessaaq) lies at the confluence of the Tuluksak and Kuskokwim Rivers in the lower Kuskokwim area in the Bethel Census Area. It is one of three communities in the Yupiit School District and has a Yup’ik population (~444) highly dependent on subsistence (Kyuk). Known historically for dog mushing and regional trade, Tuluksak faces flooding, erosion along the river channel, and permafrost thaw, and has experienced repeated water and infrastructure challenges, including damage to water treatment facilities and community buildings. Adaptation efforts focus on securing safe drinking water, stabilizing critical infrastructure, and improving flood preparedness, with broader regional support for resilient energy and housing (Adapt Alaska).Tuluksak Native CommunityP.O. Box 195Tuluksak, Alaska 99679Phone: (907) 695-6420   Fax: (907) 695-693 ??? Tuikisarmute Inc.P.O. Box 65  Tuluksak, Alaska 99679Phone: (907) 695-645 ????  Fax: (907) 693-6932YKHC – Tuluksak ClinicPhone: (907) 585-5624Tuluksak School (Yupiit School District) P.O. Box 51190 Phone: (907) 825-3600 Fax: (907) 825-2404"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Tuluksak has a 2.5-acre landfill that is prone to flooding. Permit #SW3A176-27 expires 4/27."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Tuntutuliak"}, {"type": "paragraph", "style": null, "text": "Tuntutuliak (Tuntutuliaq) is located on the Kanektok River near Kuskokwim Bay on the Kuskokwim River near its mouth, southwest/downstream of Bethel, and is a coastal–riverine Yup’ik community. Residents (~469) rely on salmon, berries, whitefish, and marine resources, with travel by boat, snowmachine, and bush plane. Tuntutuliak is vulnerable to flooding during high water events and storm surges and has been explicitly noted in federal flood warning and climate risk materials (Kyuk). Permafrost thaw further affects foundation stability and drainage. The community is pursuing protect-in-place strategies, including elevating structures, improving emergency warning and evacuation, and coordinating with regional adaptation initiatives (Adapt Alaska). Tuntuliak suffered significant damage from ex-Typhoon Halong in Oct. 2025."}, {"type": "paragraph", "style": null, "text": "Native Village of Tuntutuliak P.O. Box 8086Tuntutuliak, Alaska 99680Phone: (907) 256-2128  Fax: (907) 256-2080  Tuntutuliak Land Ltd. P.O. Box 8106  Tuntutuliak, Alaska 99680Phone: (907) 256-2315  Fax: (907) 256-2441"}, {"type": "paragraph", "style": null, "text": "YKHC – Tuntutuliak ClinicPhone: (907) 256-2121Tuntutuliak School (LKSD) Lewis Angapak Memorial School Phone: (907) 256-2125"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: Tuntuliak has a 1.9-acre landfill that has minimal management and experienced a recent fire. Permit #SW3A200-28 expires 10/28."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Tununak"}, {"type": "paragraph", "style": null, "text": "Tununak, population ~350-400, is a coastal Yup’ik village on the north shore of Nelson Island facing the Bering Sea. It has strong cultural connections with neighboring Nelson Island communities (Toksook Bay and Nightmute) and relies heavily on marine mammals, fish, and seabirds. As a low-lying coastal community, Tununak faces storm surge, erosion, and thaw-related ground instability including risks to its runway, together making it environmentally vulnerable. Although there is discontinuous permafrost on Nelson Island, the entire island is elevated on solid volcanic bedrock. While the bedrock provides safer structural foundations, the island's surface layer still contains permafrost that is actively degrading. The village is part of regional adaptation planning that looks to combine shoreline protection, strategic relocation of infrastructure, and support for traditional subsistence activities under changing environmental conditions (Indian Health Service).Native Village of TununakP.O. Box 77Tununak, Alaska 99681Phone: (907) 652-6527  Fax: (907) 652-6011  Tununrmiut Rinit  CorporationP.O. Box 89  Tununak, Alaska 99681Phone: (907) 652-6527  Fax: (907) 652-6315YKHC – Tununak ClinicPhone: (907) 652-6415Tununak School (LKSD)Phone: (907) 652-6416"}, {"type": "paragraph", "style": null, "text": "Water/Sanitation: The community uses honey buckets in most structures. There is a 4-acre landfill; permit #SW3A153-31 expires 4/31."}, {"type": "paragraph", "style": null, "text": "Housing Authority:"}, {"type": "paragraph", "style": "Heading2", "text": "Upper Kalskag"}, {"type": "paragraph", "style": null, "text": "Upper Kalskag lies just upriver from Lower Kalskag on the north bank of the Kuskokwim River in the Middle Kuskokwim. It is linked to Lower Kalskag by a 2-mile long gravel road. It developed from traditional settlements, mission activity, and later modern school and airstrip construction. Upper Kalskag’s residents are predominantly Yup’ik and Athabascan and participate heavily in subsistence while working in schools and local services. Environmental risks resemble those of Lower Kalskag: flooding, erosion, and permafrost thaw affecting infrastructure and transportation. Adaptation planning, often coordinated through the Kuspuk School District and regional organizations, emphasizes protect-in-place strategies, improved drainage, and elevation of critical facilities (Kyuk)."}];
